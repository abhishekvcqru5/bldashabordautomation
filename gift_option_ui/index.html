<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Gifts from Folder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 class="title">Gift Upload</h1>
      <form id="giftForm">
        <div class="field">
          <label for="folderPath">Folder Path</label>
          <input type="text" id="folderPath" name="folderPath" placeholder="C:\\path\\to\\folder" required />
        </div>
        <div class="field">
          <label for="giftName">Gift Name (optional)</label>
          <input type="text" id="giftName" name="giftName" placeholder="e.g., Holiday Bundle" />
        </div>
        <div class="field">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" name="quantity" min="1" value="1" required />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3" placeholder="Brief description of the gift batch"></textarea>
        </div>
        <button type="submit" class="btn">Upload Gifts</button>
      </form>
      <div id="result" class="result"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
